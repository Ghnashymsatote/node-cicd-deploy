name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ghnashymsatote/node-cicd-app:latest

  deploy:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull ghcr.io/ghnashymsatote/node-cicd-app:latest

      - name: Remove old container
        shell: powershell
        run: |
          $container = docker ps -aq -f "name=^node-cicd-app$"

          if ($container) {
            docker stop node-cicd-app
            docker rm node-cicd-app
          } else {
            Write-Host "No existing container found"
          }

      - name: Start new container
        run: docker run -d --name node-cicd-app -p 8080:8080 ghcr.io/ghnashymsatote/node-cicd-app:latest